name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.toolchain }} / ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]
        features: [default, no-default, all-features]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Test (Default Features)
        if: matrix.features == 'default'
        run: cargo test --workspace --all-targets

      - name: Test (No Default Features)
        if: matrix.features == 'no-default'
        run: cargo check --workspace --no-default-features

      - name: Test (All Features)
        if: matrix.features == 'all-features'
        run: cargo test --workspace --all-features --all-targets

  embedded-check:
    name: no_std Check (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with no_std target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check no_std target
        run: cargo check -p aether-core -p aether-task -p aether-time --target thumbv7em-none-eabihf --no-default-features

  lint:
    name: Code Formatting & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
